<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>X | Delivery & Services</title>
  
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#0c1d37">

  <!-- مكتبة السحابة ومكتبة الخرائط -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

  <style>
    :root {
      --brand-navy: #0c1d37;
      --brand-navy-light: #162c50;
      --brand-gray: #475569;
      --brand-accent: #4a7c6f;
      --brand-accent-light: #e8f2ef;
      --bg-main: #f8fafc;
      --card-bg: #ffffff;
      --border-color: #e2e8f0;
      --danger: #ef4444;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Cairo", sans-serif; -webkit-tap-highlight-color: transparent; }
    
    html, body {
      width: 100%;
      min-height: 100%;
      background-color: var(--bg-main);
    }

    body {
      display: flex;
      justify-content: center;
      align-items: flex-start;
      color: var(--brand-navy);
    }

    .app-container {
      width: 100%;
      max-width: 480px;
      min-height: 100vh;
      background: var(--bg-main);
      display: flex;
      flex-direction: column;
      position: relative;
    }

    .portal-screen {
      padding: 30px 16px 24px 16px;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
      overflow-y: auto;
    }

    .logo-hero-container {
      width: 100%;
      display: flex;
      justify-content: center;
      margin-top: 10px;
      margin-bottom: 22px;
    }

    .logo-hero-img {
      max-width: 180px;
      height: auto;
      object-fit: contain;
    }

    .hero-title {
      font-size: 26px;
      font-weight: 900;
      color: var(--brand-navy);
      text-align: center;
      margin-bottom: 6px;
      letter-spacing: -0.5px;
    }

    .hero-subtitle {
      font-size: 13.5px;
      color: var(--brand-gray);
      text-align: center;
      font-weight: 500;
      margin-bottom: 24px;
    }

    .portal-cards-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
      width: 100%;
    }

    .portal-role-card {
      background: var(--card-bg);
      border-radius: 22px;
      padding: 22px 8px 18px 8px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start;
      min-height: 265px;
      box-shadow: 0 10px 25px -4px rgba(12, 29, 55, 0.06), 0 2px 6px rgba(12, 29, 55, 0.04);
      border: 1px solid rgba(226, 232, 240, 0.9);
      cursor: pointer;
      position: relative;
      transition: transform 0.15s ease;
    }

    .portal-role-card:active {
      transform: scale(0.96);
      background: #f1f5f9;
    }

    .card-icon-wrapper {
      height: 75px;
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 12px;
    }

    .card-arrow-indicator {
      width: 22px;
      height: 22px;
      background: var(--brand-accent-light);
      color: var(--brand-accent);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 10px;
    }

    .card-role-title {
      font-size: 14px;
      font-weight: 800;
      color: var(--brand-navy);
      text-align: center;
      margin-bottom: 8px;
      line-height: 1.3;
    }

    .card-role-desc {
      font-size: 10.5px;
      color: var(--brand-gray);
      text-align: center;
      line-height: 1.45;
      font-weight: 500;
      padding: 0 2px;
    }

    .ad-banner-container {
      width: 100%;
      margin-top: 18px;
      background: #ffffff;
      border-radius: 22px;
      padding: 16px 16px 16px 14px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      box-shadow: 0 12px 26px -6px rgba(12, 29, 55, 0.07);
      border: 1.5px solid rgba(74, 124, 111, 0.22);
      cursor: pointer;
      position: relative;
      overflow: hidden;
    }

    .ad-banner-container::before {
      content: '';
      position: absolute;
      top: 0;
      right: 0;
      width: 5px;
      height: 100%;
      background: linear-gradient(180deg, var(--brand-accent) 0%, #10b981 100%);
    }

    .ad-content {
      display: flex;
      flex-direction: column;
      gap: 4px;
      max-width: 76%;
      padding-right: 4px;
    }

    .ad-tag-badge {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      width: fit-content;
      background: var(--brand-accent-light);
      color: var(--brand-accent);
      padding: 3px 8px;
      border-radius: 8px;
      font-size: 10px;
      font-weight: 800;
    }

    .ad-title {
      font-size: 13.5px;
      font-weight: 900;
      color: var(--brand-navy);
      line-height: 1.35;
    }

    .ad-desc {
      font-size: 10.5px;
      color: var(--brand-gray);
      line-height: 1.4;
      font-weight: 500;
    }

    .ad-icon-wrapper {
      position: relative;
      width: 50px;
      height: 50px;
      background: linear-gradient(135deg, #e8f5f1 0%, #d1fae5 100%);
      border: 1.5px solid rgba(16, 185, 129, 0.35);
      border-radius: 16px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .ad-sparkle-dot {
      position: absolute;
      top: -3px;
      right: -3px;
      width: 10px;
      height: 10px;
      background: #10b981;
      border: 2px solid #ffffff;
      border-radius: 50%;
    }

    .inner-header {
      background: #ffffff;
      padding: 14px 18px;
      border-bottom: 1px solid var(--border-color);
      display: flex;
      justify-content: space-between;
      align-items: center;
      position: sticky;
      top: 0;
      z-index: 50;
    }

    .header-logo {
      height: 32px;
      width: auto;
      object-fit: contain;
    }

    .back-btn {
      background: #f1f5f9;
      border: 1px solid #cbd5e1;
      color: var(--brand-navy);
      padding: 6px 14px;
      border-radius: 10px;
      font-size: 11.5px;
      font-weight: 700;
      cursor: pointer;
    }

    .content-area {
      flex: 1;
      overflow-y: auto;
      padding: 16px;
      background: var(--bg-main);
    }

    .address-bar-card {
      background: #ffffff;
      border: 1px solid #e2e8f0;
      border-right: 4px solid var(--brand-accent);
      border-radius: 16px;
      padding: 14px;
      margin-bottom: 16px;
    }

    .address-bar-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 11.5px;
      font-weight: 800;
      color: var(--brand-navy);
      margin-bottom: 6px;
    }

    .btn-edit-addr {
      background: var(--brand-navy);
      color: white;
      border: none;
      padding: 5px 12px;
      border-radius: 8px;
      font-size: 10.5px;
      font-weight: 700;
      cursor: pointer;
    }

    .section-title {
      font-size: 11.5px;
      font-weight: 800;
      color: var(--brand-navy);
      margin: 18px 0 10px 0;
    }

    .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    .grid-3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
    .grid-4 { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }

    .service-card {
      background: #ffffff;
      border: 1px solid var(--border-color);
      border-radius: 16px;
      padding: 14px 10px;
      display: flex;
      flex-direction: column;
      gap: 6px;
      cursor: pointer;
      box-shadow: 0 3px 8px rgba(12, 29, 55, 0.02);
    }

    .service-card:active { transform: scale(0.96); background: #f8fafc; }
    .service-card.highlight {
      border: 1.5px solid var(--brand-accent);
      background: #fafdfc;
    }

    .service-card-icon { font-size: 22px; }
    .service-card-title { font-size: 12px; font-weight: 800; color: var(--brand-navy); }
    .service-card-desc { font-size: 10px; color: var(--brand-gray); line-height: 1.35; }

    .modal {
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(12, 29, 55, 0.6);
      backdrop-filter: blur(4px);
      display: none;
      align-items: flex-end;
      justify-content: center;
      z-index: 1000;
    }

    .modal.show { display: flex; }

    .modal-sheet {
      background: white;
      width: 100%;
      max-width: 480px;
      border-radius: 28px 28px 0 0;
      padding: 22px 18px;
      max-height: 88vh;
      overflow-y: auto;
    }

    .input-row { margin-bottom: 12px; }
    .input-row label { display: block; font-size: 11.5px; font-weight: 700; color: var(--brand-navy); margin-bottom: 5px; }
    .input-box {
      width: 100%;
      padding: 11px 12px;
      border: 1.5px solid #cbd5e1;
      border-radius: 10px;
      font-size: 12.5px;
      outline: none;
    }

    .btn-submit {
      width: 100%;
      background: var(--brand-navy);
      color: white;
      border: none;
      padding: 14px;
      border-radius: 12px;
      font-size: 13.5px;
      font-weight: 800;
      cursor: pointer;
      margin-top: 10px;
    }

    #mapContainer {
      height: 180px;
      width: 100%;
      border-radius: 14px;
      border: 1px solid #cbd5e1;
      margin-top: 6px;
    }
  </style>
</head>

<div class="app-container">

            </div>
          </div>

          <div class="section-title">صيانة منزلية معتمدة</div>
          <div class="grid-4">
            <div class="service-card" onclick="openOrderModal('سباكة منزلية')"><center>🚿<br><b style="font-size:11px;">سباك</b></center></div>
            <div class="service-card" onclick="openOrderModal('كهرباء منزلية')"><center>⚡<br><b style="font-size:11px;">كهربائي</b></center></div>
            <div class="service-card" onclick="openOrderModal('صيانة دش وستالايت')"><center>📡<br><b style="font-size:11px;">دش</b></center></div>
            <div class="service-card" onclick="openOrderModal('نجارة منزلية')"><center>🪚<br><b style="font-size:11px;">نجار</b></center></div>
          </div>
        </div>
      `;
      return;
    }

    if (currentView === 'courier' || currentView === 'technician') {
      main.innerHTML = `
        <div class="inner-header">
          <img src="logo.png" class="header-logo" alt="X" onerror="this.style.display='none';">
          <div style="font-weight:800; font-size:14px; color:var(--brand-navy);">لوحة استقبال المهام ⚡</div>
          <button class="back-btn" onclick="navigateTo('portal')">⇄ تبديل</button>
        </div>
        <div class="content-area">
          <div style="background:#ffffff; border:1px solid var(--border-color); padding:16px; border-radius:18px; margin-bottom:14px;">
            <div style="font-size:11px; color:var(--brand-gray);">حالة الحساب:</div>
            <div style="font-size:16px; font-weight:900; color:#10b981;">حساب نشط ومربوط بالسحابة 🟢</div>
          </div>
          <div class="section-title">الطلبات المتاحة في النطاق:</div>
          <div id="liveFeedContainer" style="font-size:12px; color:var(--brand-gray); text-align:center; padding:20px;">
            جارٍ سحب الطلبات اللحظية...
          </div>
        </div>
      `;
      fetchAvailableOrders();
      return;
    }
  }

  function openAddressModal() {
    document.getElementById('inputCompound').value = clientAddress.compound;
    document.getElementById('inputBuilding').value = clientAddress.building;
    document.getElementById('inputFloor').value = clientAddress.floor;
    document.getElementById('inputApartment').value = clientAddress.apartment;
    document.getElementById('inputPhone').value = clientAddress.phone;
    document.getElementById('addressModal').classList.add('show');
    setTimeout(() => { initMap(); }, 200);
  }

  function closeAddressModal() {
    document.getElementById('addressModal').classList.remove('show');
  }

  function initMap() {
    const lat = clientAddress.lat;
    const lng = clientAddress.lng;
    if (!mapInstance) {
      mapInstance = L.map('mapContainer').setView([lat, lng], 14);
      L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(mapInstance);
      markerInstance = L.marker([lat, lng], { draggable: true }).addTo(mapInstance);
      markerInstance.on('dragend', function () {
        const pos = markerInstance.getLatLng();
        onPinMoved(pos.lat, pos.lng);
      });
      mapInstance.on('click', function (e) {
        markerInstance.setLatLng(e.latlng);
        onPinMoved(e.latlng.lat, e.latlng.lng);
      });
    } else {
      mapInstance.invalidateSize();
      mapInstance.setView([lat, lng], 14);
      markerInstance.setLatLng([lat, lng]);
    }
    onPinMoved(lat, lng);
  }

  function onPinMoved(lat, lng) {
    clientAddress.lat = lat;
    clientAddress.lng = lng;
    document.getElementById('coordsText').innerText = `تم تحديد الإحداثيات: (${lat.toFixed(4)}, ${lng.toFixed(4)}) 🟢`;
  }

  function saveAddressData() {
    const phone = document.getElementById('inputPhone').value.trim();
    if (!phone) {
      alert('يرجى إدخال رقم تليفون التواصل!');
      return;
    }
    clientAddress.compound = document.getElementById('inputCompound').value;
    clientAddress.building = document.getElementById('inputBuilding').value || '1';
    clientAddress.floor = document.getElementById('inputFloor').value || 'أرضي';
    clientAddress.apartment = document.getElementById('inputApartment').value || '1';
    clientAddress.phone = phone;
    closeAddressModal();
    render();
  }

  function openOrderModal(typeName, count = 1) {
    currentOrderType = typeName;
    const modal = document.getElementById('orderModal');
    const title = document.getElementById('modalTitle');
    const body = document.getElementById('modalBody');

    title.innerText = typeName;

    if (count > 1) {
      let inputs = '';
      for (let i = 1; i <= count; i++) {
        inputs += `
          <div class="input-row">
            <label>المحل والمطلوب (${i}):</label>
            <input type="text" class="input-box order-detail-input" placeholder="مثال: صيدلية 19011 - شريط بنادول">
          </div>
        `;
      }
      body.innerHTML = inputs + `
        <div class="input-row" style="margin-top:10px;">
          <label><b>سقف المشتريات المتوقع كاش (جنيه):</b></label>
          <input type="number" id="orderMaxBudget" class="input-box" placeholder="مثلاً: 300 ج">
        </div>
      `;
    } else {
      body.innerHTML = `
        <div class="input-row">
          <label>تفاصيل المطلوب:</label>
          <textarea id="orderGeneralDetails" class="input-box" rows="3" placeholder="اكتب التفاصيل بدقة هنا..."></textarea>
        </div>
      `;
    }

    modal.classList.add('show');
  }

  function closeOrderModal() {
    document.getElementById('orderModal').classList.remove('show');
  }

  // إرسال الطلب وحفظه في السحابة
  async function submitFinalOrder() {
    const submitBtn = document.getElementById('btnSubmitOrder');
    submitBtn.innerText = "جارٍ الحفظ والإرسال ⏳...";
    submitBtn.disabled = true;

    let detailsText = "";
    const detailInputs = document.querySelectorAll('.order-detail-input');
    if (detailInputs.length > 0) {
      detailInputs.forEach((inp, idx) => {
        if (inp.value.trim()) detailsText += `(${idx + 1}) ` + inp.value.trim() + " | ";
      });
    } else {
      const general = document.getElementById('orderGeneralDetails');
      if (general) detailsText = general.value.trim();
    }

    const budgetInput = document.getElementById('orderMaxBudget');
    const budgetVal = budgetInput ? parseFloat(budgetInput.value) || 0 : 0;
    const fullAddress = `${clientAddress.compound} - عمارة ${clientAddress.building} دور ${clientAddress.floor} شقة ${clientAddress.apartment}`;

    try {
      const { data, error } = await dbClient.from('orders').insert([
        {
          client_phone: clientAddress.phone,
          client_address: fullAddress,
          order_type: currentOrderType,
          details: detailsText || "طلب مباشر بدون تفاصيل إضافية",
          max_budget: budgetVal,
          status: "جديد"
        }
      ]);

      if (error) {
        alert("حدث تنبيه أثناء الإرسال: " + error.message);
      } else {
        alert("تم إرسال وحفظ طلبك في المنظومة بنجاح! 🚀\nرقم التواصل: " + clientAddress.phone);
        closeOrderModal();
      }
    } catch (err) {
      alert("تم إرسال الطلب (وضع الاتصال المباشر)!");
      closeOrderModal();
    } finally {
      submitBtn.innerText = "تأكيد وإرسال للمناديب ⚡";
      submitBtn.disabled = false;
    }
  }

  async function fetchAvailableOrders() {
    try {
      const { data: orders, error } = await dbClient
        .from('orders')
        .select('*')
        .order('id', { ascending: false })
        .limit(5);

      const feed = document.getElementById('liveFeedContainer');
      if (!orders || orders.length === 0) {
        feed.innerHTML = "لا توجد طلبات جديدة معلقة حالياً.";
        return;
      }

      let html = '';
      orders.forEach(o => {
        html += `
          <div style="background:#ffffff; border:1px solid #e2e8f0; border-radius:14px; padding:12px; margin-bottom:8px; text-align:right;">
            <div style="font-weight:800; font-size:12.5px; color:#0c1d37;">${o.order_type} (${o.status})</div>
            <div style="font-size:11px; color:#475569; margin:4px 0;">${o.details}</div>
            <div style="font-size:10.5px; color:#4a7c6f; font-weight:700;">المكان: ${o.client_address}</div>
          </div>
        `;
      });
      feed.innerHTML = html;
    } catch (e) {
      console.log(e);
    }
  }

  if ('serviceWorker' in navigator) {
    navigator.serviceWorker.register('./sw.js');
  }
</script>
</body>
</html>
