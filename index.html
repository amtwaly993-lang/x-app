<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>X | Delivery & Services</title>
  
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#0c1d37">

  <!-- مكتبة الخرائط Leaflet -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

  <style>
    :root {
      --brand-navy: #0c1d37;
      --brand-navy-light: #162c50;
      --brand-gray: #475569;
      --brand-accent: #4a7c6f;
      --brand-accent-light: #e8f2ef;
      --bg-main: #f8fafc;
      --card-bg: #ffffff;
      --border-color: #e2e8f0;
      --danger: #ef4444;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Cairo", sans-serif; -webkit-tap-highlight-color: transparent; }
    
    html, body {
      width: 100%;
      min-height: 100%;
      background-color: var(--bg-main);
    }

    body {
      display: flex;
      justify-content: center;
      align-items: flex-start;
      color: var(--brand-navy);
    }

    .app-container {
      width: 100%;
      max-width: 480px;
      min-height: 100vh;
      background: var(--bg-main);
      display: flex;
      flex-direction: column;
      position: relative;
    }

    /* الواجهة الترحيبية */
    .portal-screen {
      padding: 30px 16px 24px 16px;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
      overflow-y: auto;
    }

    .logo-hero-container {
      width: 100%;
      display: flex;
      justify-content: center;
      margin-top: 10px;
      margin-bottom: 22px;
    }

    .logo-hero-img {
      max-width: 180px;
      height: auto;
      object-fit: contain;
    }

    .hero-title {
      font-size: 26px;
      font-weight: 900;
      color: var(--brand-navy);
      text-align: center;
      margin-bottom: 6px;
      letter-spacing: -0.5px;
    }

    .hero-subtitle {
      font-size: 13.5px;
      color: var(--brand-gray);
      text-align: center;
      font-weight: 500;
      margin-bottom: 24px;
    }

    /* كروت الأدوار الثلاثة */
    .portal-cards-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
      width: 100%;
    }

    .portal-role-card {
      background: var(--card-bg);
      border-radius: 22px;
      padding: 22px 8px 18px 8px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start;
      min-height: 265px;
      box-shadow: 0 10px 25px -4px rgba(12, 29, 55, 0.06), 0 2px 6px rgba(12, 29, 55, 0.04);
      border: 1px solid rgba(226, 232, 240, 0.9);
      cursor: pointer;
      position: relative;
      transition: transform 0.15s ease, box-shadow 0.15s ease;
    }

    .portal-role-card:active {
      transform: scale(0.96);
      background: #f1f5f9;
    }

    .card-icon-wrapper {
      height: 75px;
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 12px;
    }

    .card-arrow-indicator {
      width: 22px;
      height: 22px;
      background: var(--brand-accent-light);
      color: var(--brand-accent);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 10px;
    }

    .card-role-title {
      font-size: 14px;
      font-weight: 800;
      color: var(--brand-navy);
      text-align: center;
      margin-bottom: 8px;
      line-height: 1.3;
    }

    .card-role-desc {
      font-size: 10.5px;
      color: var(--brand-gray);
      text-align: center;
      line-height: 1.45;
      font-weight: 500;
      padding: 0 2px;
    }

    /* كارت الشراكة والمتاجر الجديد المتطابق والملفت */
    .ad-banner-container {
      width: 100%;
      margin-top: 18px;
      background: #ffffff;
      border-radius: 22px;
      padding: 16px 16px 16px 14px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      box-shadow: 0 12px 26px -6px rgba(12, 29, 55, 0.07), 0 3px 8px rgba(74, 124, 111, 0.05);
      border: 1.5px solid rgba(74, 124, 111, 0.22);
      cursor: pointer;
      position: relative;
      overflow: hidden;
      transition: all 0.2s cubic-bezier(0.16, 1, 0.3, 1);
    }

    .ad-banner-container:active {
      transform: scale(0.97);
      background: #f8fafc;
    }

    /* لمسة شريط التمييز الأيمن */
    .ad-banner-container::before {
      content: '';
      position: absolute;
      top: 0;
      right: 0;
      width: 5px;
      height: 100%;
      background: linear-gradient(180deg, var(--brand-accent) 0%, #10b981 100%);
      border-radius: 0 22px 22px 0;
    }

    .ad-content {
      display: flex;
      flex-direction: column;
      gap: 4px;
      max-width: 76%;
      padding-right: 4px;
    }

    .ad-tag-badge {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      width: fit-content;
      background: var(--brand-accent-light);
      color: var(--brand-accent);
      padding: 3px 8px;
      border-radius: 8px;
      font-size: 10px;
      font-weight: 800;
    }

    .ad-title {
      font-size: 13.5px;
      font-weight: 900;
      color: var(--brand-navy);
      line-height: 1.35;
    }

    .ad-desc {
      font-size: 10.5px;
      color: var(--brand-gray);
      line-height: 1.4;
      font-weight: 500;
    }

    /* الأيقونة الملفتة والنقية */
    .ad-icon-wrapper {
      position: relative;
      width: 50px;
      height: 50px;
      min-width: 50px;
      background: linear-gradient(135deg, #e8f5f1 0%, #d1fae5 100%);
      border: 1.5px solid rgba(16, 185, 129, 0.35);
      border-radius: 16px;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 6px 14px rgba(16, 185, 129, 0.2);
      animation: pulse-badge 2.8s infinite ease-in-out;
    }

    @keyframes pulse-badge {
      0%, 100% {
        transform: scale(1);
        box-shadow: 0 6px 14px rgba(16, 185, 129, 0.2);
      }
      50% {
        transform: scale(1.06);
        box-shadow: 0 10px 20px rgba(16, 185, 129, 0.38);
      }
    }

    .ad-sparkle-dot {
      position: absolute;
      top: -3px;
      right: -3px;
      width: 10px;
      height: 10px;
      background: #10b981;
      border: 2px solid #ffffff;
      border-radius: 50%;
    }

    /* الشريط العلوي */
    .inner-header {
      background: #ffffff;
      padding: 14px 18px;
      border-bottom: 1px solid var(--border-color);
      display: flex;
      justify-content: space-between;
      align-items: center;
      position: sticky;
      top: 0;
      z-index: 50;
    }

    .header-logo {
      height: 32px;
      width: auto;
      object-fit: contain;
    }

    .back-btn {
      background: #f1f5f9;
      border: 1px solid #cbd5e1;
      color: var(--brand-navy);
      padding: 6px 14px;
      border-radius: 10px;
      font-size: 11.5px;
      font-weight: 700;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 5px;
    }

    .back-btn:active {
      background: #e2e8f0;
    }

    /* مساحة الخدمات */
    .content-area {
      flex: 1;
      overflow-y: auto;
      padding: 16px;
      background: var(--bg-main);
    }

    .address-bar-card {
      background: #ffffff;
      border: 1px solid #e2e8f0;
      border-right: 4px solid var(--brand-accent);
      border-radius: 16px;
      padding: 14px;
      margin-bottom: 16px;
      box-shadow: 0 4px 12px rgba(12, 29, 55, 0.03);
    }

    .address-bar-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 11.5px;
      font-weight: 800;
      color: var(--brand-navy);
      margin-bottom: 6px;
    }

    .btn-edit-addr {
      background: var(--brand-navy);
      color: white;
      border: none;
      padding: 5px 12px;
      border-radius: 8px;
      font-size: 10.5px;
      font-weight: 700;
      cursor: pointer;
    }

    .section-title {
      font-size: 11.5px;
      font-weight: 800;
      color: var(--brand-navy);
      margin: 18px 0 10px 0;
      letter-spacing: 0.3px;
    }

    .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    .grid-3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
    .grid-4 { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }

    .service-card {
      background: #ffffff;
      border: 1px solid var(--border-color);
      border-radius: 16px;
      padding: 14px 10px;
      display: flex;
      flex-direction: column;
      gap: 6px;
      cursor: pointer;
      box-shadow: 0 3px 8px rgba(12, 29, 55, 0.02);
      transition: transform 0.15s ease;
    }

    .service-card:active { transform: scale(0.96); background: #f8fafc; }
    .service-card.highlight {
      border: 1.5px solid var(--brand-accent);
      background: #fafdfc;
    }

    .service-card-icon { font-size: 22px; }
    .service-card-title { font-size: 12px; font-weight: 800; color: var(--brand-navy); }
    .service-card-desc { font-size: 10px; color: var(--brand-gray); line-height: 1.35; }

    /* النوافذ */
    .modal {
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(12, 29, 55, 0.6);
      backdrop-filter: blur(4px);
      display: none;
      align-items: flex-end;
      justify-content: center;
      z-index: 1000;
    }

    .modal.show { display: flex; }

    .modal-sheet {
      background: white;
      width: 100%;
      max-width: 480px;
      border-radius: 28px 28px 0 0;
      padding: 22px 18px;
      max-height: 88vh;
      overflow-y: auto;
      animation: slideUp 0.25s cubic-bezier(0.16, 1, 0.3, 1);
    }

    @keyframes slideUp { from { transform: translateY(100%); } to { transform: translateY(0); } }

    .input-row { margin-bottom: 12px; }
    .input-row label { display: block; font-size: 11.5px; font-weight: 700; color: var(--brand-navy); margin-bottom: 5px; }
    .input-box {
      width: 100%;
      padding: 11px 12px;
      border: 1.5px solid #cbd5e1;
      border-radius: 10px;
      font-size: 12.5px;
      outline: none;
    }

    .input-box:focus { border-color: var(--brand-navy); }

    .btn-submit {
      width: 100%;
      background: var(--brand-navy);
      color: white;
      border: none;
      padding: 14px;
      border-radius: 12px;
      font-size: 13.5px;
      font-weight: 800;
      cursor: pointer;
      margin-top: 10px;
    }

    .btn-submit:active { background: #162c50; }

    #mapContainer {
      height: 180px;
      width: 100%;
      border-radius: 14px;
      border: 1px solid #cbd5e1;
      margin-top: 6px;
    }
  </style>
</head>
<body>

<div class="app-container">
  <div id="mainView"></div>
</div>

<!-- نافذة ضبط العنوان والخريطة التفاعلية -->
<div class="modal" id="addressModal">
  <div class="modal-sheet">
    <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:12px;">
      <h3 style="font-size:14.5px; font-weight:800; color:var(--brand-navy);">📍 عنوان التوصيل ورقم الهاتف</h3>
      <span onclick="closeAddressModal()" style="cursor:pointer; font-size:20px; color:var(--brand-gray); padding:4px;">✕</span>
    </div>

    <div class="input-row">
      <label>رقم تليفون التواصل:</label>
      <input type="tel" id="inputPhone" class="input-box" placeholder="010xxxxxxxx" dir="ltr" style="text-align:right;">
    </div>

    <div class="input-row">
      <label>الكمبوند / المنطقة:</label>
      <select id="inputCompound" class="input-box">
        <option value="سكن مصر الداون تاون">سكن مصر الداون تاون</option>
        <option value="طريق المنطقة ص - حدائق أكتوبر">طريق المنطقة ص - حدائق أكتوبر</option>
        <option value="مدينة هرم سيتي">مدينة هرم سيتي</option>
        <option value="محيط إدارة حدائق أكتوبر">محيط إدارة حدائق أكتوبر</option>
        <option value="منطقة أخرى بالمحيط">منطقة أخرى بالمحيط</option>
      </select>
    </div>

    <div class="input-row">
      <div style="display:grid; grid-template-columns: 1fr 1fr 1fr; gap:6px;">
        <div>
          <label>العمارة</label>
          <input type="text" id="inputBuilding" class="input-box" placeholder="14">
        </div>
        <div>
          <label>الدور</label>
          <input type="text" id="inputFloor" class="input-box" placeholder="3">
        </div>
        <div>
          <label>الشقة</label>
          <input type="text" id="inputApartment" class="input-box" placeholder="8">
        </div>
      </div>
    </div>

    <div class="input-row">
      <label>حدد موقعك بالدبوس على الخريطة:</label>
      <div id="mapContainer"></div>
      <div id="coordsText" style="font-size:11px; color:var(--brand-accent); font-weight:bold; margin-top:5px;">الإحداثيات: جارٍ التحميل...</div>
    </div>

    <button class="btn-submit" onclick="saveAddressData()">حفظ واعتماد العنوان</button>
  </div>
</div>

<!-- نافذة تسجيل الطلبات -->
<div class="modal" id="orderModal">
  <div class="modal-sheet">
    <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:12px;">
      <h3 id="modalTitle" style="font-size:14.5px; font-weight:800; color:var(--brand-navy);">تفاصيل الطلب</h3>
      <span onclick="closeOrderModal()" style="cursor:pointer; font-size:20px; color:var(--brand-gray); padding:4px;">✕</span>
    </div>
    <div id="modalBody"></div>
    <button class="btn-submit" onclick="submitFinalOrder()">تأكيد وإرسال للمناديب ⚡</button>
  </div>
</div>

<script>
  let clientAddress = {
    compound: 'سكن مصر الداون تاون',
    building: '14',
    floor: '2',
    apartment: '5',
    phone: '01012345678',
    lat: 29.950660,
    lng: 30.972718
  };

  let currentView = 'portal';
  let mapInstance = null;
  let markerInstance = null;

  render();

  function navigateTo(viewName) {
    currentView = viewName;
    render();
    window.scrollTo(0, 0);
  }

  function render() {
    const main = document.getElementById('mainView');

    if (currentView === 'portal') {
      main.innerHTML = `
        <div class="portal-screen">
          <div class="logo-hero-container">
            <img src="logo.png" class="logo-hero-img" alt="X Delivery & Services" onerror="this.src='https://cdn-icons-png.flaticon.com/512/2972/2972185.png';">
          </div>

          <h1 class="hero-title">«إزاي نقدر نساعدك؟»</h1>
          <p class="hero-subtitle">اختار الخدمة المناسبة وابدأ في ثواني</p>

          <div class="portal-cards-grid">
            <!-- كارت 1: أنا عميل -->
            <div class="portal-role-card" onclick="navigateTo('client')">
              <div class="card-icon-wrapper">
                <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="#4a7c6f" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
                  <circle cx="9" cy="21" r="1"></circle>
                  <circle cx="20" cy="21" r="1"></circle>
                  <path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"></path>
                  <path d="M10 9h6v4h-6z"></path>
                </svg>
              </div>
              <div class="card-arrow-indicator">
                <svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"></polyline></svg>
              </div>
              <div class="card-role-title">أنا عميل</div>
              <div class="card-role-desc">اريد مشتريات او توصيل اوصيانة منزلية</div>
            </div>

            <!-- كارت 2: أنا مندوب توصيل -->
            <div class="portal-role-card" onclick="navigateTo('courier')">
              <div class="card-icon-wrapper">
                <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="#4a7c6f" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
                  <circle cx="6" cy="18" r="3"></circle>
                  <circle cx="18" cy="18" r="3"></circle>
                  <path d="M9 18h6"></path>
                  <path d="M18 15V9h-4l-3 6"></path>
                  <path d="M15 9l-2-4H8"></path>
                  <circle cx="6" cy="7" r="2"></circle>
                </svg>
              </div>
              <div class="card-arrow-indicator">
                <svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"></polyline></svg>
              </div>
              <div class="card-role-title">أنا مندوب توصيل»</div>
              <div class="card-role-desc">مضمون ومعتمد استقبل الطلبات واكسب من مشاويري »</div>
            </div>

            <!-- كارت 3: أنا فني معتمد -->
            <div class="portal-role-card" onclick="navigateTo('technician')">
              <div class="card-icon-wrapper">
                <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="#4a7c6f" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
                  <path d="M14.7 6.3a1 1 0 0 0 0 1.4l1.6 1.6a1 1 0 0 0 1.4 0l3.77-3.77a6 6 0 0 1-7.94 7.94l-6.91 6.91a2.12 2.12 0 0 1-3-3l6.91-6.91a6 6 0 0 1 7.94-7.94l-3.76 3.76z"></path>
                  <path d="M4 4l4 4"></path>
                </svg>
              </div>
              <div class="card-arrow-indicator">
                <svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"></polyline></svg>
              </div>
              <div class="card-role-title">أنا فني معتمد</div>
              <div class="card-role-desc">استقبل طلبات الصيانة والمعاينات</div>
            </div>
          </div>

          <!-- كارت الشراكة والمتاجر الجديد المتطابق والملفت -->
          <div class="ad-banner-container" onclick="window.open('https://wa.me/201012345678?text=أرغب%20في%20الانضمام%20كشريك%20تجاري%20على%20منصة%20X', '_blank')">
            <div class="ad-content">
              <div class="ad-tag-badge">
                <span>🚀</span>
                <span>فرصة لشركاء النجاح</span>
              </div>
              <div class="ad-title">أصحاب المحلات والأنشطة التجارية</div>
              <div class="ad-desc">ضاعف مبيعاتك اليومية ووصّل عروضك لكل سكان المنطقة مباشرة!</div>
            </div>
            <div class="ad-icon-wrapper">
              <svg width="27" height="27" viewBox="0 0 24 24" fill="none" stroke="#0c1d37" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                <path d="M3 9l1-5h16l1 5"></path>
                <path d="M3 9a3 3 0 0 0 6 0 3 3 0 0 0 6 0 3 3 0 0 0 6 0"></path>
                <path d="M4 14v6a1 1 0 0 0 1 1h14a1 1 0 0 0 1-1v-6"></path>
                <path d="M9 21v-4a1 1 0 0 1 1-1h4a1 1 0 0 1 1 1v4"></path>
              </svg>
              <div class="ad-sparkle-dot"></div>
            </div>
          </div>
        </div>
      `;
      return;
    }

    if (currentView === 'client') {
      main.innerHTML = `
        <div class="inner-header">
          <img src="logo.png" class="header-logo" alt="X" onerror="this.style.display='none';">
          <div style="font-weight:800; font-size:14px; color:var(--brand-navy);">خدمات المنزل والمشاوير</div>
          <button class="back-btn" onclick="navigateTo('portal')">⇄ تبديل</button>
        </div>

        <div class="content-area">
          <div class="address-bar-card">
            <div class="address-bar-header">
              <span>📍 موقع التسليم ورقم الهاتف:</span>
              <button class="btn-edit-addr" onclick="openAddressModal()">تعديل ✏️</button>
            </div>
            <div style="font-size:12px; color:var(--brand-navy); line-height:1.45;">
              <b>${clientAddress.compound}</b> - عمارة ${clientAddress.building}، دور ${clientAddress.floor}، شقة ${clientAddress.apartment}<br>
              <span style="color:var(--brand-accent); font-weight:700;">📞 رقم التواصل: ${clientAddress.phone}</span>
            </div>
          </div>

          <div class="section-title">مشاوير وطلبات شراء للمنزل</div>
          <div class="grid-2">
            <div class="service-card highlight" onclick="openOrderModal('single_multi', 2)">
              <span class="service-card-icon">🛵</span>
              <span class="service-card-title">مشوار خفيف</span>

  function openAddressModal() {
    document.getElementById('inputCompound').value = clientAddress.compound;
    document.getElementById('inputBuilding').value = clientAddress.building;
    document.getElementById('inputFloor').value = clientAddress.floor;
    document.getElementById('inputApartment').value = clientAddress.apartment;
    document.getElementById('inputPhone').value = clientAddress.phone;

    document.getElementById('addressModal').classList.add('show');

    setTimeout(() => {
      initMap();
    }, 200);
  }

  function closeAddressModal() {
    document.getElementById('addressModal').classList.remove('show');
  }

  function initMap() {
    const lat = clientAddress.lat;
    const lng = clientAddress.lng;

    if (!mapInstance) {
      mapInstance = L.map('mapContainer').setView([lat, lng], 14);
      L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
        attribution: '© OpenStreetMap'
      }).addTo(mapInstance);

      markerInstance = L.marker([lat, lng], { draggable: true }).addTo(mapInstance);

      markerInstance.on('dragend', function () {
        const pos = markerInstance.getLatLng();
        onPinMoved(pos.lat, pos.lng);
      });

      mapInstance.on('click', function (e) {
        markerInstance.setLatLng(e.latlng);
        onPinMoved(e.latlng.lat, e.latlng.lng);
      });
    } else {
      mapInstance.invalidateSize();
      mapInstance.setView([lat, lng], 14);
      markerInstance.setLatLng([lat, lng]);
    }
    onPinMoved(lat, lng);
  }

  function onPinMoved(lat, lng) {
    clientAddress.lat = lat;
    clientAddress.lng = lng;
    document.getElementById('coordsText').innerText = `تم تحديد الإحداثيات: (${lat.toFixed(4)}, ${lng.toFixed(4)}) 🟢`;
  }

  function saveAddressData() {
    const phone = document.getElementById('inputPhone').value.trim();
    if (!phone) {
      alert('يرجى كتابة رقم تليفون التواصل!');
      return;
    }
    clientAddress.compound = document.getElementById('inputCompound').value;
    clientAddress.building = document.getElementById('inputBuilding').value || '1';
    clientAddress.floor = document.getElementById('inputFloor').value || 'أرضي';
    clientAddress.apartment = document.getElementById('inputApartment').value || '1';
    clientAddress.phone = phone;

    closeAddressModal();
    render();
  }

  function openOrderModal(type, param) {
    const modal = document.getElementById('orderModal');
    const title = document.getElementById('modalTitle');
    const body = document.getElementById('modalBody');

    if (type === 'single_multi') {
      title.innerText = param <= 2 ? 'طلب مشوار خفيف (1 إلى 2 طلب)' : 'طلب مشوار مجمّع (3 إلى 6 طلبات)';
      let inputs = '';
      for (let i = 1; i <= param; i++) {
        inputs += `
          <div class="input-row">
            <label>المحل والمطلوب (${i}):</label>
            <input type="text" class="input-box" placeholder="مثال: صيدلية 19011 - شريط بنادول">
          </div>
        `;

      body.innerHTML = inputs + `
        <div class="input-row" style="margin-top:10px;">
          <label><b>سقف المشتريات المتوقع كاش (جنيه):</b></label>
          <input type="number" class="input-box" placeholder="مثلاً: 300 ج">
        </div>
      `;
    } 
    else if (type === 'gas') {
      title.innerText = 'خدمة أسطوانة غاز';

            <option value="yes">نعم، يوجد مصعد</option>

          <label>هل الأنبوبة الفارغة جاهزة للاستبدال الفوري؟</label>

            <option value="no">لا، شراء أسطوانة جديدة بالكامل</option>

        </div>
      `;
    }
    else if (type === 'laundry') {

        <div class="input-row">
          <label>تفاصيل الملابس والمطلوب:</label>

    }
    else if (type === 'car_sos') {
      title.innerText = 'طوارئ سيارات خفيفة 🚗';
      body.innerHTML = `
        <div class="input-row">
          <label>نوع المساعدة المطلوبة:</label>
          <select class="input-box">
            <option>وصلة كابل شحن بطارية (Jump-start)</option>
            <option>منفاخ هواء إطارات سريع</option>

          </select>
        </div>
        <div class="input-row">
          <label>مكان ركن السيارة بالتحديد:</label>
          <input type="text" class="input-box" placeholder="مثال: باركينج عمارة 14 أمام المدخل">
        </div>
      `;
    }
    else if (type === 'tech') {
      title.innerText = `طلب فني صيانة: ${param}`;
      body.innerHTML = `
        <div style="background:#fffbeb; border:1px solid #fef3c7; border-radius:8px; padding:8px; font-size:11px; color:#b45309; margin-bottom:10px;">
          ⚠️ رسوم المعاينة والكشف ثابتة (50 ج)، والمصنعية الإجمالية تحدد بالاتفاق بعد الفحص.
        </div>
        <div class="input-row">
          <label>وصف المشكلة بدقة:</label>
          <textarea class="input-box" rows="3" placeholder="اشرح العطل بالتفصيل..."></textarea>

    }
    else {
      title.innerText = 'طلب مشوار أو توصيلة';
      body.innerHTML = `
        <div class="input-row">
          <label>الوجهة وتفاصيل المشوار:</label>

    }

    modal.classList.add('show');
  }

  function closeOrderModal() {
    document.getElementById('orderModal').classList.remove('show');
  }

  function submitFinalOrder() {
    alert(
      `تم إرسال طلبك بنجاح للمناديب عبر منصة X!\n\n` +
      `بيانات العميل المعتمدة:\n` +
      `• المكان: ${clientAddress.compound} - عمارة ${clientAddress.building} - شقة ${clientAddress.apartment}\n` +
      `• الهاتف: ${clientAddress.phone}`
    );
    closeOrderModal();
  }

  if ('serviceWorker' in navigator) {
    navigator.serviceWorker.register('./sw.js');
  }
</script>
